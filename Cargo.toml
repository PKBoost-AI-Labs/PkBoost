[package]
edition = "2021"
rust-version = "1.70"
name = "pkboost"
version = "2.2.0"
authors = ["Pushp Kharat <kharatpushp16@outlook.com>"]
build = false
exclude = [
    "data/*",
    "raw_data/*",
    "temp/*",
    "benchmark results/*",
    "DryBeanDataset/*",
    "python/*",
    "diagrams/*",
    "*.csv",
    "target/*",
    "src/bin/*",
    "profile.json.gz",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Shannon-guided gradient boosting for extreme class imbalance with adaptive drift detection. Outperforms XGBoost/LightGBM on imbalanced data."
homepage = "https://github.com/Pushp-Kharat1/pkboost"
documentation = "https://docs.rs/pkboost"
readme = "README.md"
keywords = [
    "machine-learning",
    "gradient-boosting",
    "classification",
    "imbalanced-data",
    "drift-detection",
]
categories = [
    "science",
    "algorithms",
]
license = "GPL-3.0"
repository = "https://github.com/Pushp-Kharat1/pkboost"

[lib]
name = "pkboost"
crate-type = [
    "cdylib",
    "rlib",
]
path = "src/lib.rs"

[dependencies.csv]
version = "1.3"

[dependencies.fork_union]
version = "2.3"

[dependencies.half]
version = "2.4"
features = [
    "std",
    "num-traits",
]

[dependencies.log]
version = "0.4"

[dependencies.mimalloc]
version = "0.1"

[dependencies.ndarray]
version = "0.17.1"
features = ["rayon"]

[dependencies.num_cpus]
version = "1.16"

[dependencies.numpy]
version = "0.27"

[dependencies.orx-parallel]
version = "1"

[dependencies.pyo3]
version = "0.27"
features = ["extension-module"]

[dependencies.rand]
version = "0.8"

[dependencies.rayon]
version = "1.8"

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
version = "1.0"

[dependencies.simsimd]
version = "6.5.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2
